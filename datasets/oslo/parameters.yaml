# Per-acquisition reconstruction parameters, shared by every folder's
# reconstruct.py. For each acquisition:
#   pipeline      -- which reconstruction to use:
#                    scanline (focused linear FI, per-beam),
#                    sector   (phased/steered focused, pipeline_sector.yaml),
#                    iq       (baseband IQ, pipeline_iq.yaml),
#                    compound (non-focused linear, pipeline.yaml).
#   zlims/xlims   -- display window in mm (framing only).
#   dynamic_range -- display dynamic range in dB (default [-60, 0]).
#   refocus       -- if true, also emit a REFoCUS variant (<name>_zea_refocus_bmode.png).
#                    REFoCUS (Bottenus 2018) inverts the transmit-encoding matrix to
#                    recover the multistatic (full-matrix-capture) dataset before DAS.
#                    Enabled for every acquisition with enough encoded transmits to make
#                    the inversion well posed (>= 8 transmit events). reconstruct.py picks
#                    the polar pipeline_refocus_sector.yaml for `sector` acquisitions and
#                    the linear/cartesian pipeline_refocus.yaml for everything else.
#                    NOT enabled where REFoCUS is ill-posed or undefined:
#                      * single/few-transmit acquisitions (plane-wave tracking with
#                        n_tx=1, PICMUS with 5 angles),
#                      * synthetic transmit aperture (STA) acquisitions, which are
#                        already multistatic (nothing to decode).

