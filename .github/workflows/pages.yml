name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "plots/open_h_rf_datasets.py"
      - "scripts/authors.csv"
      - "scripts/compile_authors.py"
      - "CITATION.bib"
      - "README.md"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "plots/open_h_rf_datasets.py"
      - "scripts/authors.csv"
      - "scripts/compile_authors.py"
      - "CITATION.bib"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Check catalog.yaml
        run: uv run --no-project --with pyyaml python site/build.py --check

      - name: Syntax-check the page scripts
        run: node --check site/assets/js/site.js && node --check site/assets/js/svg.js

      # site/update.py refreshes site/hub/, the build's main input.
      - name: Build
        run: uv run --no-project --with pyyaml python site/build.py

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
